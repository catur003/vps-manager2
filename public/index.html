<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vps-manager API</title>
<style>
  :root {
    --bg: #0b0e14;
    --card: #131722;
    --border: #232838;
    --ink: #e7e9ee;
    --ink-muted: #8b93a7;
    --accent: #7c6cf0;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1a1f2e 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .status-text {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
    font-family: monospace;
  }
  p {
    color: var(--ink-muted);
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 20px;
  }
  .meta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
  }
  .meta-label { color: var(--ink-muted); }
  .meta-value { font-family: monospace; color: var(--ink); }
  .footer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--ink-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="status-row">
      <span class="dot"></span>
      <span class="status-text">Online</span>
    </div>
    <h1>vps-manager</h1>
    <p>REST API buat kelola VPS dari ZenVPS App - deploy, database, nginx, SSL, dan lainnya. Semua endpoint di bawah ini butuh API key (header <code>Authorization: Bearer &lt;key&gt;</code>), kecuali <code>/health</code>.</p>
    <div class="meta">
      <div class="meta-row">
        <span class="meta-label">Health check</span>
        <span class="meta-value">GET /health</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Autentikasi</span>
        <span class="meta-value">Bearer token</span>
      </div>
    </div>
    <div class="footer">Diakses lewat aplikasi ZenVPS.</div>
  </div>
</body>
</html>
